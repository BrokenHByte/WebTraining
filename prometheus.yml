global:
  scrape_interval: 15s

scrape_configs:
  - job_name: event-service
    static_configs:
      - targets: ["event-service:8080"]
    metrics_path: /metrics

  - job_name: booking-service
    static_configs:
      - targets: ["booking-service:8080"]
    metrics_path: /metrics

  - job_name: authorization-service
    static_configs:
      - targets: ["authorization-service:8080"]
    metrics_path: /metrics 